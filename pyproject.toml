[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miyang-mirage"
version = "0.1.0"
description = "Diagnosis-guided restoration of digital ripple artifacts in iteratively edited AI images"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Yicheng Xu" },
  { name = "Jiayin Chen" },
  { name = "Muting Wang" },
]
keywords = [
  "image-restoration",
  "digital-ripple",
  "image-processing",
  "generative-ai",
  "frequency-domain",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "Pillow>=10,<13",
  "scikit-image>=0.24,<1",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
face = ["opencv-python-headless>=4.10,<5"]
dev = [
  "build>=1.2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
mirage = "mirage.pipeline:main"
mirage-diagnose = "mirage.diagnosis:main"

[project.urls]
Homepage = "https://github.com/miyang-ai/Mi-Ripple"
Issues = "https://github.com/miyang-ai/Mi-Ripple/issues"
Paper = "https://github.com/miyang-ai/Mi-Ripple/tree/main/paper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
